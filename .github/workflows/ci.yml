name: CI

on:
  push:
    branches:
      - main
      - develop
      - feat/**
      - fix/**
      - docs/**
      - perf/**
      - refactor/**
      - chore/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Harness contracts
        run: pnpm harness:check

      - name: Commitlint
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm exec commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          else
            base="$PUSH_BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
            pnpm exec commitlint --from "$base" --to "$HEAD_SHA" --verbose
          fi

      - name: Static quality and production build
        run: pnpm check

      - name: Git hook contract smoke test
        shell: sh
        run: |
          grep -F 'lint-staged' .husky/pre-commit
          grep -F 'commitlint' .husky/commit-msg
