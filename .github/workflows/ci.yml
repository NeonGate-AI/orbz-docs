name: CI

on:
  push:
    branches:
      - main
      - staging
      - feat/**
      - fix/**
      - docs/**
      - perf/**
      - refactor/**
      - chore/**
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_VERSION: 24

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Harness contracts
        run: pnpm harness:check

      - name: Commitlint
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm exec commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          else
            base="$PUSH_BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              if [ "$GITHUB_REF" != "refs/heads/main" ] && git show-ref --verify --quiet refs/remotes/origin/main; then
                base="$(git merge-base origin/main "$HEAD_SHA")"
              else
                base="$(git rev-list --max-parents=0 "$HEAD_SHA")"
              fi
            fi
            pnpm exec commitlint --from "$base" --to "$HEAD_SHA" --verbose
          fi

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Behavioral regression tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Production dependency audit
        run: pnpm security:audit

      - name: Git hook contract smoke test
        shell: sh
        run: |
          grep -F 'lint-staged' .husky/pre-commit
          grep -F 'commitlint' .husky/commit-msg
